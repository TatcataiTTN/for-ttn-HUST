<line x1="500" y1="150" x2="470" y2="205"/><line x1="500" y1="150" x2="530" y2="205"/>
</g>
<!-- highlight path for update of leaf 3 (index 230,205) -->
<g stroke="#e0433c" stroke-width="3" fill="none">
<line x1="290" y1="205" x2="260" y2="150"/><line x1="260" y1="150" x2="200" y2="100"/><line x1="200" y1="100" x2="320" y2="50"/>
</g>
<circle cx="290" cy="205" r="10" fill="#e0433c"/>
<text x="20" y="230" font-size="12" fill="#5b6072">Mức 0 (gốc): x⁽⁰⁾∈ℝ¹ · Mức 1: x⁽¹⁾∈ℝ² · Mức 2: x⁽²⁾∈ℝ⁴ · Mức 3 (lá): x⁽³⁾∈ℝ⁸</text>
<text x="20" y="248" font-size="12" fill="#e0433c">Đỏ: cập nhật 1 phần tử → phải cập nhật sketch tại MỌI tổ tiên của lá đó</text>
</svg>
