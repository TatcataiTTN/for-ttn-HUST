<circle cx="350" cy="205" r="10"/><circle cx="410" cy="205" r="10"/>
<circle cx="470" cy="205" r="10"/><circle cx="530" cy="205" r="10"/>
</g>
<g stroke="#2b5ce6" stroke-width="1.3">
